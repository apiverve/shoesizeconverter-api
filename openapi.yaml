openapi: 3.0.4
info:
  title: Shoe Size Converter
  description: >-
    Shoe Size Converter translates footwear measurements across regional
    standards, including US, UK, Australian, Mexican, and Korean sizing systems.
    Provide a size, source region, and gender category to get equivalent sizes,
    with paid plans adding European, Japanese, and centimeter measurements.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/shoesizeconverter:
    get:
      summary: Shoe Size Converter
      description: Convert shoe size between international standards
      operationId: shoesizeconverter
      parameters:
        - name: size
          in: query
          schema:
            type: string
          required: true
          description: The shoe size to convert
          example: '9'
        - name: from
          in: query
          schema:
            type: string
          required: true
          description: Source region
          example: us
        - name: gender
          in: query
          schema:
            type: string
          required: false
          description: Gender sizing
          example: men
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  input_size: 9
                  input_region: US
                  gender: men
                  conversions:
                    cm: 29.1
                    jp: 29.1
                    us: 9
                    uk: 8.1
                    au: 8.1
                    eu: 43.7
                    mx: 13.7
                    kr: 43.7
                  note: Sizes are approximate and may vary by manufacturer
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
